name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: pip install ruff
      - run: python -m compileall -q app tests
      - run: ruff check --select E9,F63,F7,F82 app tests scripts
      - run: python tests/test_pure.py
      - run: python -m unittest tests.test_password_auth tests.test_identity_transport tests.test_frontend_contract tests.test_settings_and_persona

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --check app/views/js/app.js
      - run: node --check app/views/js/api.js
      - run: npm run test:frontend
